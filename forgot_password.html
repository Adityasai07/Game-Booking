<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="signup.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center pt-12 font-sans">
  <div class="flex gap-3 mb-6">
    <a href="login.html">
      <button class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 font-medium transition">Back to Login</button>
    </a>
  </div>

  <h2 class="text-2xl text-gray-800 font-semibold mb-5">Forgot Password</h2>
  <form id="otpForm" class="bg-white p-6 rounded-lg shadow-md w-80 text-center">
    <input type="text" name="username" placeholder="User Name" required 
      class="w-full px-3 py-2 mb-3 border border-gray-300 rounded text-sm" />
    
    <input type="email" name="email" placeholder="Registered Email" required 
      class="w-full px-3 py-2 mb-4 border border-gray-300 rounded text-sm" />
    
    <button type="submit" 
      class="w-full py-2 bg-blue-600 text-white rounded text-base font-medium hover:bg-blue-700 transition">
      Send OTP
    </button>
  </form>

  <div id="otpSection" class="bg-white p-6 rounded-lg shadow-md w-80 text-center mt-6 hidden">
    <input type="text" id="otp" placeholder="Enter OTP" 
      class="w-full px-3 py-2 mb-3 border border-gray-300 rounded text-sm" />
    
    <input type="password" id="newPassword" placeholder="New Password" 
      class="w-full px-3 py-2 mb-3 border border-gray-300 rounded text-sm" />
    
    <input type="password" id="confirmPassword" placeholder="Confirm Password" 
      class="w-full px-3 py-2 mb-4 border border-gray-300 rounded text-sm" />
    
    <button id="resetBtn" 
      class="w-full py-2 bg-blue-600 text-white rounded text-base font-medium hover:bg-blue-700 transition">
      Verify & Reset Password
    </button>
  </div>

  <div id="messageBox" class="fixed top-4 right-4 w-80 z-50"></div>
        <template id="messageTemplate">
            <div class="message bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative shadow-lg mb-4" role="alert">
                <strong class="font-bold">Notice: </strong>
                <span class="block sm:inline message-text"></span>
                <span onclick="this.parentElement.remove()" class="absolute top-1 right-2 text-xl font-bold cursor-pointer text-blue-700 hover:text-blue-900">&times;</span>
            </div>
        </template>
  <script>
    function showMessage(text, type = 'info') {
      const box = document.getElementById('messageBox');
      const template = document.getElementById('messageTemplate');
      const clone = template.content.cloneNode(true);
      const message = clone.querySelector('.message');
      const textSpan = clone.querySelector('.message-text');

      if (type === 'success') {
        message.className = 'message bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative shadow-lg mb-4';
      } else if (type === 'error') {
        message.className = 'message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative shadow-lg mb-4';
      }

      textSpan.textContent = text;
      box.appendChild(clone);
      setTimeout(() => {
        if (box.firstChild) box.removeChild(box.firstChild);
      }, 4000);
    }

    let canSendOTP = true;
    document.getElementById('otpForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const sendBtn = this.querySelector('button[type="submit"]');

      if (!canSendOTP) {
        showMessage('Please wait before sending another OTP.', 'error');
        return;
      }

      const formData = new FormData(this);

      fetch('send_otp.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.text())
      .then(data => {
        if (data.includes('OTP sent')) {
          showMessage(data, 'success');
          document.getElementById('otpSection').style.display = 'block';

          canSendOTP = false;
          let countdown = 10;
          sendBtn.disabled = true;
          sendBtn.textContent = `Resend OTP in ${countdown}s`;

          const interval = setInterval(() => {
            countdown--;
            sendBtn.textContent = `Resend OTP in ${countdown}s`;

            if (countdown === 0) {
              clearInterval(interval);
              canSendOTP = true;
              sendBtn.disabled = false;
              sendBtn.textContent = 'Send OTP';
            }
          }, 1000);

        } else {
          showMessage(data, 'error');
        }
      })
      .catch(() => showMessage('Something went wrong.', 'error'));
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      const otp = document.getElementById('otp').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match!', 'error');
        return;
      }

      fetch('verify_otp.php', {
        method: 'POST',
        body: new URLSearchParams({
          otp: otp,
          newPassword: newPassword
        })
      })
      .then(res => res.text())
      .then(data => {
        if (data.includes('success')) {
          showMessage('Password reset successful!', 'success');
          window.location.href = 'login.html'
        } else {
          showMessage(data, 'error');
        }
      })
      .catch(() => showMessage('Error resetting password.', 'error'));
    });
  </script>
</body>
</html>
